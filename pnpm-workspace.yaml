packages:
  - "packages/*"

# Which dependencies may run install scripts. pnpm writes a placeholder here the
# first time it meets a package with one and REFUSES to install until every entry
# is a real boolean — so an unanswered entry is not a warning, it is a red CI on
# a clean checkout. Locally it stays invisible: an already-populated node_modules
# makes `pnpm install --frozen-lockfile` a no-op that never reaches this list.
#
# The tree-sitter grammars are `false` because their build script compiles native
# bindings we never load: `treeSitter.ts` reads the .wasm files shipped inside
# those same packages through `web-tree-sitter`. Building them would add node-gyp
# to every install to produce an artifact nothing imports.
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-typescript: false
