name: Publish TypeScript SDK

on:
  workflow_dispatch:
    inputs:
      arterm_release_tag:
        description: Released arterm tag whose binaries should be bundled
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish @arclude/arterm-sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enforce Rust and TypeScript SDK surface parity
        working-directory: ${{ github.workspace }}
        run: cargo test -p arterm-sdk parity -- --nocapture

      - name: Install dependencies
        run: npm ci

      - name: Validate SDK
        run: npm run check

      - name: Download released arterm runtimes
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sdk-runtime-assets
          gh release download "${{ inputs.arterm_release_tag }}" --dir sdk-runtime-assets \
            --pattern 'arterm-linux-x86_64.tar.gz' \
            --pattern 'arterm-linux-aarch64.tar.gz' \
            --pattern 'arterm-macos-x86_64.tar.gz' \
            --pattern 'arterm-macos-aarch64.tar.gz' \
            --pattern 'arterm-windows-x86_64.tar.gz' \
            --pattern 'arterm-windows-aarch64.tar.gz'

      - name: Prepare platform packages
        working-directory: ${{ github.workspace }}
        run: bash scripts/prepare_sdk_runtime_packages.sh sdk-runtime-assets

      # These must exist before the main package is published. npm selects only
      # the package matching the consumer's os/cpu from optionalDependencies.
      # NODE_AUTH_TOKEN is what the .npmrc written by setup-node's
      # `registry-url` reads. Nothing set it, so every publish here 401'd --
      # and `id-token: write` does not substitute for it, because npm trusted
      # publishing is configured per package and none of the @arclude packages
      # exist yet. The scope has to be claimed on npm before the first run.
      - name: Publish platform runtime packages
        working-directory: ${{ github.workspace }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in sdk/npm/*; do
            npm publish "$package" --access public --provenance
          done

      - name: Publish with npm provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
