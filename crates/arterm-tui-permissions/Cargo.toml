[package]
name = "arterm-tui-permissions"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "arterm_tui_permissions"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = { version = "0.29", features = ["event-stream"] }
arterm-base = { path = "../arterm-base", default-features = false }
arterm-core = { path = "../arterm-core" }
arterm-tui-style = { path = "../arterm-tui-style" }
ratatui = "0.30"
serde_json = "1"
