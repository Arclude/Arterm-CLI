[package]
name = "arterm-provider-gemini-runtime"
version = "0.1.0"
edition = "2024"
description = "Gemini provider runtime (Code Assist OAuth + Developer API key) for arterm, kept downstream of arterm-base so provider edits do not rebuild the app spine"

[lib]
name = "arterm_provider_gemini_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# default-features = false: the top-level binary decides heavy optional base
# features (embeddings/bedrock). Runtime crates must not re-enable them via
# feature unification, or --no-default-features release targets (e.g. Windows
# ARM64, which cannot build tract-linalg asm) break.
arterm-base = { path = "../arterm-base", default-features = false }
arterm-message-types = { path = "../arterm-message-types" }
arterm-provider-core = { path = "../arterm-provider-core" }
arterm-provider-gemini = { path = "../arterm-provider-gemini" }
arterm-schema-dialect = { path = "../arterm-schema-dialect" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
arterm-provider-antigravity = { path = "../arterm-provider-antigravity" }
arterm-provider-anthropic = { path = "../arterm-provider-anthropic" }
arterm-provider-openai = { path = "../arterm-provider-openai" }
arterm-provider-openrouter = { path = "../arterm-provider-openrouter" }
serde = { version = "1", features = ["derive"] }
# The migrated gemini tests use arterm-base's test-env sandbox (lock_test_env).
arterm-base = { path = "../arterm-base", default-features = false, features = ["test-support"] }
tempfile = "3"
