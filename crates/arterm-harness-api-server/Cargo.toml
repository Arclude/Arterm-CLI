[package]
name = "arterm-harness-api-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Harness API endpoint: bridges versioned API clients onto the internal arterm protocol"

[dependencies]
anyhow = "1"
arterm-harness-api = { path = "../arterm-harness-api" }
arterm-transport = { path = "../arterm-transport" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The parser in `background_progress` reads markdown produced by the daemon's
# own formatter, so the contract test builds that formatter rather than a copy
# of its output: a change to the wire prose then fails here instead of silently
# turning every client's progress bar off. Dev-only, so the bridge binary stays
# free of the application foundation.
arterm-base = { path = "../arterm-base", default-features = false }
arterm-background-types = { path = "../arterm-background-types" }

[[bin]]
name = "arterm-harness-api-bridge"
path = "src/bin/bridge.rs"
