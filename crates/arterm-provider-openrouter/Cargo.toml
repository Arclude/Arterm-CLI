[package]
name = "arterm-provider-openrouter"
version = "0.1.0"
edition = "2024"

[dependencies]
arterm-schema-dialect = { path = "../arterm-schema-dialect" }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
futures = "0.3"
arterm-core = { path = "../arterm-core" }
arterm-logging = { path = "../arterm-logging" }
arterm-message-types = { path = "../arterm-message-types" }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
