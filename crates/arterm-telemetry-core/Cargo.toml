[package]
name = "arterm-telemetry-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "arterm_telemetry_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
arterm-build-meta = { path = "../arterm-build-meta" }
arterm-core = { path = "../arterm-core" }
arterm-logging = { path = "../arterm-logging" }
arterm-provider-core = { path = "../arterm-provider-core" }
arterm-selfdev-types = { path = "../arterm-selfdev-types" }
arterm-storage = { path = "../arterm-storage" }
arterm-usage-types = { path = "../arterm-usage-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde_json = "1"
walkdir = "2"
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
