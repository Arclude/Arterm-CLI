[workspace]
resolver = "2"
members = [
    "crates/arterm",
    "crates/arterm-message-types",
    "crates/arterm-tool-types",
    "crates/arterm-agent-runtime",
    "crates/arterm-tool-core",
    "crates/arterm-provider-core",
    "crates/arterm-core",
    "crates/arterm-config",
    "crates/arterm-providers",
    "crates/arterm-tools",
    "crates/arterm-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TUI
ratatui = "0.30"
crossterm = "0.28"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
anyhow = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }

# Internal crates — listed in dependency order, lowest layer first.
# L0 contracts: data only, no tokio/reqwest/ratatui. Everything depends on these,
# so a runtime dependency here would put the whole tree on a type edit's rebuild path.
arterm-message-types = { path = "crates/arterm-message-types" }
arterm-tool-types = { path = "crates/arterm-tool-types" }

# L1 runtime contracts: traits and primitives, still no UI or HTTP.
arterm-agent-runtime = { path = "crates/arterm-agent-runtime" }
arterm-tool-core = { path = "crates/arterm-tool-core" }
arterm-provider-core = { path = "crates/arterm-provider-core" }

arterm-core = { path = "crates/arterm-core" }
arterm-config = { path = "crates/arterm-config" }
arterm-providers = { path = "crates/arterm-providers" }
arterm-tools = { path = "crates/arterm-tools" }
arterm-tui = { path = "crates/arterm-tui" }
