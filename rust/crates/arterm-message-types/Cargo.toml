[package]
name = "arterm-message-types"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stable conversation data contracts: Message, ContentBlock, StreamEvent, ToolDefinition."

# A contract crate. Dependencies stay limited to serde/chrono on purpose: this
# is depended on by every layer above, so pulling tokio/reqwest/ratatui in here
# would put the whole runtime on the rebuild path of a type-only edit.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
