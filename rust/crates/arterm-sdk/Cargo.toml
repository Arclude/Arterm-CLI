[package]
name = "arterm-sdk"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust SDK for the arterm harness API: connect, drive sessions, stream events"

[dependencies]
arterm-harness-api = { path = "../arterm-harness-api" }
jsonschema = { version = "0.49.3", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
