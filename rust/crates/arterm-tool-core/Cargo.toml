[package]
name = "arterm-tool-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "arterm_tool_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
arterm-agent-runtime = { path = "../arterm-agent-runtime" }
arterm-message-types = { path = "../arterm-message-types" }
arterm-tool-types = { path = "../arterm-tool-types" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
